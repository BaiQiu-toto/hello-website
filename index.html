<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toto的测试网站</title>
    <style>
        /* 让网页占满整个屏幕，并隐藏可能出现的滚动条 */
        body, html {
            margin: 0;
            内边距: 0;
            宽度: 100%;
            高度: 100%;
            溢出: 隐藏;
        }

        /* 使用 Flexbox 布局，轻松实现水平和垂直居中 */
        .center-container {
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            宽度: 100%;
            高度: 100%;
            背景颜色：#f9f9f9； /* 设置一个柔和的背景色 */
            字体族: "微软雅黑", Arial, 无衬线体;
        }

        /* 文字样式 */
        h1 {
            字体大小: 4rem; /* 字体大小 */
            颜色: #333;     /* 字体颜色 */
            margin: 0;
        }
    </style>
</head>
<正文>
    <div class="center-container">
        <h1>天童kei大人万岁</h1>
    </div>
</body>
</html>
