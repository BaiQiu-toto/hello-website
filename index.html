<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toto的测试网站</title>
    <style>
        /* 让网页占满整个屏幕，并隐藏可能出现的滚动条 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


                /* 游戏链接样式 */
        .game-link {
            display: inline-block;
            font-size: 1.5rem;
            color: #4CAF50;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #4CAF50;
            border-radius: 30px;
            transition: all 0.3s ease;
            margin: 15px 0;
        }

        .game-link:hover {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        /* 使用 Flexbox 布局，轻松实现水平和垂直居中 */
        .center-container {
            display: flex;
            flex-direction: column; /* 让子元素（图片、文字、提示）垂直排列 */
            justify-content: center; /* 垂直居中 */
            align-items: center;     /* 水平居中 */
            width: 100%;
            height: 100%;
            background-color: #f9f9f9; /* 柔和的背景色 */
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 图片样式 */
        .top-image {
            width: 150px; /* 你可以根据需要调整图片宽度 */
            height: auto; /* 保持图片比例 */
            margin-bottom: 20px; /* 图片和主文字之间留出距离 */
            border-radius: 8px; /* 让图片边缘变圆润 */
        }

        /* 主文字样式 */
        h1 {
            font-size: 3rem; 
            color: #333;     
            margin: 0;
        }

        /* 底部提示小字样式 */
        .hint-text {
            font-size: 0.9rem;       /* 较小的字号 */
            color: #888;             /* 灰色字体 */
            margin-top: 30px;        /* 与主文字拉开距离 */
        }
    </style>
</head>
<body>
    <div class="center-container">
        <!-- 1. 图片在最上方 (记得把 image.png 换成你真实的图片文件名) -->
        <img src="kei.jpg" alt="网站图片" class="top-image">

        
        
        <!-- 2. 主文字在中间 -->
        <h1>天童kei大人万岁</h1>

         <!-- 新增：测试游戏链接 -->
        <p>
            <a href="/gametest/game.html" class="game-link">🎮 测试游戏</a>
        </p>
        
        <!-- 3. 提示小字在最下方 -->
        <p class="hint-text">ctrl+F5强制刷新</p>
    </div>
</body>
</html>
