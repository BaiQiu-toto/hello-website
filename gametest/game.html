<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

                .source-text {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 游戏容器 */
        .game-wrapper {
            background-color: #16213e;
            padding: 30px 40px 40px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 {
            color: #e0e0e0;
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        h1 span {
            color: #4CAF50;
        }

        canvas {
            border: 3px solid #4CAF50;
            border-radius: 10px;
            background-color: #0f3460;
            display: block;
            margin: 0 auto;
        }

        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            color: #aaa;
            font-size: 1rem;
        }

        .score {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls button {
            padding: 8px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        #restartBtn {
            background-color: #4CAF50;
            color: white;
        }

        #restartBtn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #backBtn {
            background-color: #555;
            color: white;
        }

        #backBtn:hover {
            background-color: #777;
            transform: scale(1.05);
        }

        .hint {
            color: #666;
            font-size: 0.85rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>🐍 贪吃<span>蛇</span></h1>
        <p class="source-text">游戏来源于网络</p>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="info">
            <span class="score">🍎 得分: <span id="scoreDisplay">0</span></span>
            <div class="controls">
                <button id="restartBtn">🔄 重新开始</button>
                <button id="backBtn">🏠 返回首页</button>
            </div>
        </div>
        <p class="hint">⬆⬇⬅➡ 方向键控制移动</p>
    </div>

    <script>
        // -------- 游戏配置 --------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');

        const boxSize = 20;          // 每个格子大小
        const gridSize = 20;         // 20x20 网格
        const canvasSize = boxSize * gridSize;

        // -------- 游戏状态 --------
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let gameOver = false;
        let gameInterval = null;
        const moveInterval = 150;    // 移动速度（毫秒）

        // -------- 初始化 --------
        function initGame() {
            // 蛇：初始长度为3，水平放置
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameOver = false;
            scoreSpan.textContent = '0';
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, moveInterval);
        }

        // -------- 生成食物（避开蛇身） --------
        function generateFood() {
            let pos;
            let isOnSnake;
            do {
                pos = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize)
                };
                isOnSnake = snake.some(seg => seg.x === pos.x && seg.y === pos.y);
            } while (isOnSnake);
            food = pos;
        }

        // -------- 游戏主循环 --------
        function gameLoop() {
            if (gameOver) return;

            // 应用有效方向
            const opposites = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            if (nextDirection && opposites[nextDirection] !== direction) {
                direction = nextDirection;
            }

            // 计算新蛇头位置
            const head = { ...snake[0] };
            switch (direction) {
                case 'right': head.x++; break;
                case 'left': head.x--; break;
                case 'up': head.y--; break;
                case 'down': head.y++; break;
            }

            // -------- 碰撞检测 --------
            // 1. 撞墙
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                endGame();
                return;
            }

            // 2. 撞自己（注意：如果吃到食物，尾部会增长，需要特殊处理）
            const willEat = (head.x === food.x && head.y === food.y);
            let newSnake;
            if (willEat) {
                // 吃到食物：蛇头直接插入，尾部不动
                newSnake = [head, ...snake];
            } else {
                // 没吃到：蛇头插入，移除尾部
                newSnake = [head, ...snake.slice(0, -1)];
            }

            // 检查新蛇头是否与身体其他部分重叠（忽略蛇头自身）
            const headCollision = newSnake.slice(1).some(seg => seg.x === head.x && seg.y === head.y);
            if (headCollision) {
                endGame();
                return;
            }

            // 更新蛇
            snake = newSnake;

            // 处理食物
            if (willEat) {
                score++;
                scoreSpan.textContent = score;
                generateFood();
            }

            // 绘制画面
            drawCanvas();
        }

        // -------- 游戏结束 --------
        function endGame() {
            gameOver = true;
            clearInterval(gameInterval);
            drawCanvas(); // 重绘以显示 "Game Over"
        }

        // -------- 绘制画面 --------
        function drawCanvas() {
            // 清空画布
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            // 绘制网格线（细线装饰）
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * boxSize, 0);
                ctx.lineTo(i * boxSize, canvasSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * boxSize);
                ctx.lineTo(canvasSize, i * boxSize);
                ctx.stroke();
            }

            // 绘制食物
            ctx.shadowColor = '#ff6348';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(
                food.x * boxSize + boxSize / 2,
                food.y * boxSize + boxSize / 2,
                boxSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // 绘制蛇
            snake.forEach((seg, index) => {
                const isHead = index === 0;
                const x = seg.x * boxSize;
                const y = seg.y * boxSize;
                const padding = isHead ? 1 : 2;
                const radius = 4;

                // 蛇身颜色：头部亮绿，身体渐变
                if (isHead) {
                    ctx.fillStyle = '#2ecc71';
                } else {
                    const ratio = 1 - (index / snake.length) * 0.5;
                    const g = Math.floor(200 * ratio);
                    ctx.fillStyle = `rgb(46, ${g}, 80)`;
                }

                // 圆角矩形
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + boxSize - radius, y);
                ctx.quadraticCurveTo(x + boxSize, y, x + boxSize, y + radius);
                ctx.lineTo(x + boxSize, y + boxSize - radius);
                ctx.quadraticCurveTo(x + boxSize, y + boxSize, x + boxSize - radius, y + boxSize);
                ctx.lineTo(x + radius, y + boxSize);
                ctx.quadraticCurveTo(x, y + boxSize, x, y + boxSize - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                ctx.fill();

                // 蛇头眼睛
                if (isHead) {
                    ctx.fillStyle = 'white';
                    let ex1, ey1, ex2, ey2;
                    const offset = 5;
                    switch (direction) {
                        case 'right':
                            ex1 = x + 12;
                            ey1 = y + 4;
                            ex2 = x + 12;
                            ey2 = y + 12;
                            break;
                        case 'left':
                            ex1 = x + 4;
                            ey1 = y + 4;
                            ex2 = x + 4;
                            ey2 = y + 12;
                            break;
                        case 'up':
                            ex1 = x + 4;
                            ey1 = y + 4;
                            ex2 = x + 12;
                            ey2 = y + 4;
                            break;
                        case 'down':
                            ex1 = x + 4;
                            ey1 = y + 12;
                            ex2 = x + 12;
                            ey2 = y + 12;
                            break;
                    }
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2, ey2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(ex1 + (direction === 'right' ? 1.5 : direction === 'left' ? -1.5 : 0),
                        ey1 + (direction === 'down' ? 1.5 : direction === 'up' ? -1.5 : 0),
                        1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2 + (direction === 'right' ? 1.5 : direction === 'left' ? -1.5 : 0),
                        ey2 + (direction === 'down' ? 1.5 : direction === 'up' ? -1.5 : 0),
                        1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 游戏结束遮罩
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvasSize, canvasSize);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 40px "Microsoft YaHei", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💀 游戏结束', canvasSize / 2, canvasSize / 2 - 10);
                ctx.fillStyle = '#aaa';
                ctx.font = '18px "Microsoft YaHei", Arial, sans-serif';
                ctx.fillText('点击「重新开始」再来一局', canvasSize / 2, canvasSize / 2 + 45);
            }
        }

        // -------- 键盘控制 --------
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            e.preventDefault();

            if (gameOver) return;

            switch (key) {
                case 'ArrowUp':
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') nextDirection = 'right';
                    break;
                default:
                    return;
            }
        });

        // -------- 按钮事件 --------
        document.getElementById('restartBtn').addEventListener('click', () => {
            initGame();
            drawCanvas();
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = '/';
        });

        // -------- 启动游戏 --------
        initGame();
        drawCanvas();
    </script>
</body>
</html>
